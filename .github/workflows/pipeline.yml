name: Pipeline
# trigger
on:
  pull_request:
    branches:
      - main
# workflow permet de lire les files
permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # download code in worker

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore # resolves thee packages needd 

      - name: Build
        run: dotnet build --no-restore --configuration Release
        #--no-restore : 	Skips dependency restoration (puisque c'est deja done)
        #--configuration Release : 	not use Debug config

  test:
    name: Run tests
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Run unit tests
        run: dotnet test --no-restore --configuration Release --logger "console;verbosity=normal" # console the output with a normal level detail

  merge:
    name: Merge pull request
    needs: test
    if: github.event_name == 'pull_request' && github.event.action != 'closed' #Run this only for Pull Request events that are not close
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Merge pull request
        env:
          GH_TOKEN: ${{ secrets.GH_PATH }} #GitHub token used for authentication
          PR_NUMBER: ${{ github.event.pull_request.number }} #Gets the Pull Request number
          GH_REPO: ${{ github.repository }} #Gets the repository name
        run: gh pr merge "$PR_NUMBER" --merge # c'est pour la fusionne de la PR sur Main dans la gh CLI
