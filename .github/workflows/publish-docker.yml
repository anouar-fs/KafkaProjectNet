name: Publish Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write # autorise to publish docker imae on GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # action built in to restore the code anf make it usable to the pipeline

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3 # tool of construction docker images

      - name: Log in to GitHub Container Registry # authentification in in the regestry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker image metadata
        id: meta # id used to refer to this step after
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} # name of the image (regestry + imageName (app name))
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./kafkaTestApp
          file: ./kafkaTestApp/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }} # tags from the meta step
          labels: ${{ steps.meta.outputs.labels }} # metadata generated by docker/metadata-action@v5 at meta step

      - name: Checkout GitOps repository
        uses: actions/checkout@v4 # restore the code and make it usable to the pipeline
        with:
          repository: anouar-fs/KafkaProjectNet-GitOps
          ref: main
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops # make the files in a directory gitops

      - name: Update Kubernetes deployment image
        env:
          IMAGE_TAG: ${{ github.sha }} # SHA complet du commit Git
        run: |
          SHORT_SHA=$(echo "$IMAGE_TAG" | cut -c1-7)

          sed -i -E \
            "s|^([[:space:]]*image:[[:space:]]*)ghcr.io/anouar-fs/kafkaprojectnet:.*|\1ghcr.io/anouar-fs/kafkaprojectnet:sha-${SHORT_SHA}|" \
            gitops/application/deployment.yaml
  # script above take 7 first letters of the image tag and change the file deployement.yml 
      - name: Commit and push GitOps changes
        working-directory: gitops
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add application/deployment.yaml

          if git diff --cached --quiet; then
            echo "No deployment image changes detected."
            exit 0
          fi

          git commit -m "chore: update kafkaprojectnet image to ${IMAGE_TAG}"
          git push origin HEAD:main
# define username and email of autor and if there is no changes exit