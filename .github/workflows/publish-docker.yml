name: Publish Docker Image

on: push: branches: - main workflow_dispatch:

permissions: contents: read packages: write

env: REGISTRY: ghcr.io IMAGE_NAME: ${{ github.repository }}

jobs: publish: name: Build, Push and Update GitOps Manifest runs-on: ubuntu-latest

steps:
  - name: Checkout application repository
    uses: actions/checkout@v4

  - name: Set up Docker Buildx
    uses: docker/setup-buildx-action@v3

  - name: Log in to GitHub Container Registry
    uses: docker/login-action@v3
    with:
      registry: ${{ env.REGISTRY }}
      username: ${{ github.actor }}
      password: ${{ secrets.GITHUB_TOKEN }}

  - name: Extract Docker image metadata
    id: meta
    uses: docker/metadata-action@v5
    with:
      images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      tags: |
        type=raw,value=latest
        type=sha

  - name: Build and push Docker image
    id: build
    uses: docker/build-push-action@v6
    with:
      context: ./kafkaTestApp
      file: ./kafkaTestApp/Dockerfile
      push: true
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}

  - name: Checkout GitOps repository
    uses: actions/checkout@v4
    with:
      repository: anouar-fs/KafkaProjectNet-GitOps
      token: ${{ secrets.GITOPS_TOKEN }}
      path: gitops

  - name: Update Kubernetes deployment image
    env:
      IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
    run: |
      set -euo pipefail

      MANIFEST="gitops/application/deployment.yaml"

      if [ ! -f "$MANIFEST" ]; then
        echo "Manifest not found: $MANIFEST"
        exit 1
      fi

      sed -i -E \
        "s|^([[:space:]]*image:).*|\1 ${IMAGE}|" \
        "$MANIFEST"

      echo "Updated image:"
      grep -n 'image:' "$MANIFEST"

  - name: Commit and push GitOps manifest
    working-directory: gitops
    env:
      IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
    run: |
      set -euo pipefail

      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      if git diff --quiet -- application/deployment.yaml; then
        echo "No manifest changes to commit."
        exit 0
      fi

      git add application/deployment.yaml
      git commit -m "chore: update KafkaProjectNet image to ${IMAGE}"
      git push